experiment: correctors

problem:
  name: periodic
  epsilon: 1.0

R:
  start: 2.5
  stop: 14.5
  num: 7

delta: 1.5

mesh:
  points_per_unit: 140

T:
  default_setting: true

corrector_kind: [elliptic, parabolic]

parabolic_settings:
  max_time_step: 0.25

solver_parameters:
  elliptic:
    ksp_view: true
    ksp_monitor: true
  parabolic:
    initial:
      ksp_type: preonly
      pc_type: lu
      ksp_view: true
      ksp_monitor: true
    step:
      ksp_type: preonly
      pc_type: lu
      ksp_view: true
      ksp_monitor: true
