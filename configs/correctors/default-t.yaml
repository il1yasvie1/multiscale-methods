# HPC version
experiment: correctors

problem:
  name: periodic
  epsilon: 1.0

R:
  start: 0.1
  stop: 15.0
  num: 150

delta: 0.25

mesh:
  points_per_unit: 128

T:
  default_setting: true

corrector_kind: [elliptic, parabolic, modified]

parabolic_settings:
  max_time_step: 0.25

solver_parameters:
  elliptic:
    ksp_view: true
    ksp_monitor: true
    ksp_type: cg
    pc_type: gamg
  parabolic:
    initial:
      ksp_type: cg
      pc_type: gamg
    step:
      ksp_type: cg
      pc_type: gamg
