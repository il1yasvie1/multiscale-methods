[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multiscale-methods"
version = "0.1.0"
description = "Reusable multiscale finite element components for DOLFINx"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mpi4py", "petsc4py"]

[project.optional-dependencies]
modified = ["slepc4py"]
experiments = ["matplotlib", "pandas", "PyYAML"]

[tool.setuptools.packages.find]
where = ["."]
include = ["multiscale*"]
namespaces = false
